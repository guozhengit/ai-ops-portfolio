# CI 门禁：README 发布门（测试全通过）的自动执行器
# 原则：绿了才能合，红了必须修——作品集的最低纪律。
name: ci

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/self-healing-agent/**'
      - 'prototypes/model-router/**'
      - 'prototypes/infra-checkup/**'
      - 'verification/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'prototypes/self-healing-agent/**'
      - 'prototypes/model-router/**'
      - 'prototypes/infra-checkup/**'
      - 'verification/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  self-healing-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # io.agentscope 2.0.4-SNAPSHOT 为本地源码构建产物（未发布 Central），
      # 从仓库 libs/ 预置进本地 m2，模拟本地开发机的依赖环境
      - name: 预置本地构建的 agentscope 依赖
        run: |
          mkdir -p ~/.m2/repository/io/agentscope
          cp -r prototypes/self-healing-agent/libs/io/agentscope/* ~/.m2/repository/io/agentscope/
          find ~/.m2/repository/io/agentscope -name "*.jar" | wc -l

      - name: 单元测试（11 例，含白名单拒绝/失败隔离/去重）
        working-directory: prototypes/self-healing-agent
        run: mvn -B test

      - name: 打包冒烟（Boot 可执行 jar 能产出）
        working-directory: prototypes/self-healing-agent
        run: mvn -B package -DskipTests

      - name: 密钥泄露扫描（.env 治理纪律的机器化）
        run: |
          # fixtures 是评测靶场，故意埋了假凭据（sk-live-... 之类），必须排除，
          # 否则真机核对写进 md 文档时会被误判成泄露导致 CI 红。
          if grep -rniE "sk-[a-z0-9]{20,}|ark-[0-9a-f]{8}-" \
               --include="*.java" --include="*.yml" --include="*.md" prototypes/ \
               | grep -v "sk-14cd\|示例\|example\|your_\|fixtures/\|靶场\|假数据"; then
            echo "::error::疑似明文密钥入库"
            exit 1
          else
            echo "scan clean"
          fi

  model-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 单元测试（含熔断语义/402 落空/别名改写/成本计算）
        working-directory: prototypes/model-router
        run: mvn -B test

      - name: 打包冒烟
        working-directory: prototypes/model-router
        run: mvn -B package -DskipTests

  infra-checkup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 纯标准库，无第三方依赖：CI 不需要装 requirements
      - name: 编译检查
        working-directory: prototypes/infra-checkup
        run: python -m compileall -q infra_checkup scoring cli.py

      - name: 单元测试（黄金用例/自推断/DNS 漂移分级/脱敏/反注入/降级）
        working-directory: prototypes/infra-checkup
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: 评分器元验证（评分器对已知答案必须 100% 判对，否则不评原型）
        working-directory: prototypes/infra-checkup
        run: python cli.py verify-scorer

      # CI 连不到内网 160，真机 precision/recall 由本地 scoring/run_score.py 产出并留档；
      # 这里用内置快照跑一次评分器，保证评分链路本身在 CI 可复现。
      - name: 评分链路冒烟（内置快照，不依赖外网）
        working-directory: prototypes/infra-checkup
        run: python -c "from scoring.score import self_test, score; assert self_test(); print('scorer ok')"
