# chaos-demo —— 故障注入靶场（160 部署版）
# 与本机版的差异：加入外部 devnet 网络（与 analytics-stack 共享），
# Prometheus 按容器名 chaos-demo:9400 抓取，无需 host 端口也能通；
# 9400 仍映射宿主机便于人工探活。
name: chaos-demo

services:
  chaos-demo:
    build: .
    container_name: chaos-demo
    restart: unless-stopped        # OOMKilled 后自动拉起，制造「崩溃-恢复」真实时间线
    mem_limit: 256m
    ports:
      - "9400:9400"
    volumes:
      - chaos-logs:/data/chaos-logs   # 专属卷，磁盘场景只膨胀这里
    environment:
      CHAOS_DISK_QUOTA: "524288000"   # 500MB 模拟配额
      CHAOS_POOL_SIZE: "10"
    networks:
      - devnet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9400/status', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  devnet:
    external: true

volumes:
  chaos-logs:
